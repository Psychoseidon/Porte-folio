<script>
const st=document.getElementById('stage'),m=document.getElementById('map');
const W=+m.getAttribute('width'),H=+m.getAttribute('height');
let s=1,x=0,y=0;
const apply=()=>m.style.transform=`translate(${x}px,${y}px) scale(${s})`;
function fit(){const r=st.getBoundingClientRect();s=Math.min(r.width/W,r.height/H)*0.98;x=(r.width-W*s)/2;y=(r.height-H*s)/2;apply()}
function zoom(f,cx,cy){const r=st.getBoundingClientRect();cx??=r.width/2;cy??=r.height/2;const n=Math.min(4,Math.max(0.15,s*f));x=cx-(cx-x)*n/s;y=cy-(cy-y)*n/s;s=n;apply()}
document.getElementById('zin').onclick=()=>zoom(1.25);
document.getElementById('zout').onclick=()=>zoom(0.8);
document.getElementById('fit').onclick=fit;
st.addEventListener('wheel',e=>{e.preventDefault();const r=st.getBoundingClientRect();zoom(e.deltaY<0?1.12:0.89,e.clientX-r.left,e.clientY-r.top)},{passive:false});
let p=null;
st.addEventListener('pointerdown',e=>{p={px:e.clientX,py:e.clientY,x,y};st.setPointerCapture(e.pointerId);st.classList.add('drag')});
st.addEventListener('pointermove',e=>{if(!p)return;x=p.x+e.clientX-p.px;y=p.y+e.clientY-p.py;apply()});
st.addEventListener('pointerup',()=>{p=null;st.classList.remove('drag')});
addEventListener('resize',fit);fit();
</script>
